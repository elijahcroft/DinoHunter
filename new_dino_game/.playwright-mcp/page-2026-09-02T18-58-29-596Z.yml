      - heading "You have one bull, and two rounds" [level=1]
      - paragraph: A humid coastal floodplain in what is now eastern Montana. Somewhere out along the channel is a mature bull Triceratops prorsus — nine tonnes, and the most common large animal in this formation. He is licensed to you. Nothing else here is.
      - paragraph: He will smell you long before he sees you. Watch the wind, keep it in your face, and stay low. A bull that is merely alert can be settled by standing still. A bull that has your scent is gone.
      - paragraph: Put the first round through the lungs, behind the shoulder. A gut shot will not stop him — it will just make you walk a very long way.
